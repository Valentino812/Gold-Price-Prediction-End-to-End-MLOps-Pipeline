name: Gold and Swiss Franc Dataset Preprocessing

on:
  push:
    branches:
      - main
    paths:
      - "data/raw/*.csv"
      - "preprocessing/**"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  preprocessing:
    name: Run preprocessing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: preprocessing/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r preprocessing/requirements.txt

      - name: Verify raw inputs are present
        run: |
          set -euo pipefail
          test -f "data/raw/XAU_USD Historical Data.csv"
          test -f "data/raw/CHF_USD Historical Data.csv"

      - name: Run preprocessing script
        run: python preprocessing/preprocessing.py

      - name: Verify preprocessing output
        run: |
          python - <<'PY'
          import pandas as pd

          expected = (
              ["Date", "return_gold"]
              + [f"return_gold_lag_{i}" for i in range(1, 11)]
              + [f"return_chf_lag_{i}" for i in range(1, 11)]
          )
          path = "data/processed/harga_emas_dan_swiss_franc_preprocessing.csv"
          df = pd.read_csv(path)
          assert len(df) > 0, "Dataset hasil preprocessing kosong"
          assert list(df.columns) == expected, f"Skema kolom salah: {list(df.columns)}"
          assert df.isna().sum().sum() == 0, "Masih terdapat missing values"
          assert all(
              pd.api.types.is_numeric_dtype(df[c]) for c in expected[1:]
          ), "Ada kolom non-numerik"
          assert df["Date"].notna().all(), "Kolom Date memiliki nilai kosong"
          print("OK: dataset final", df.shape, "dengan skema yang benar")
          PY

      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: processed-dataset
          path: data/processed/harga_emas_dan_swiss_franc_preprocessing.csv
          if-no-files-found: error
          retention-days: 14
